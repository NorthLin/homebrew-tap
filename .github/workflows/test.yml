name: Install formula
on:
  push:
    paths: ["Formula/**", ".github/workflows/test.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d
      - run: brew install NorthLin/tap/plane-cli
      - run: brew test NorthLin/tap/plane-cli
      - run: plane --version
